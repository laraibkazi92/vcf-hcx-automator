openapi: 3.0.0
info:
  contact:
    name: VMware
  description: API query for HCX virtual machine migrations details.
  license:
    name: Copyright (c) 2020-2021 VMware, Inc. All rights reserved.
  title: HCX query migrations API.
  version: "1.0"
security:
 - x-hm-authorization: []
servers:
- url: https://{server}/hybridity/api
  variables:
    server:
      default: hcx_mgr_server
      description: HCX Manager server host name
tags:
- description: API to query virtual machine migrations details from HCX Manager.
  name: Query migrations details
paths:
  /migrations:
    post:
      description: Returns the virtual machine migrations and their status details.
      operationId: queryHcxMigrations
      parameters:
      - explode: true
        in: query
        name: action
        required: true
        description: Represents which action type to do on migration(s). This API is for querying migration(s) action.
        schema:
          enum:
          - query
          type: string
        style: form
      requestBody:
        description: Query migrations filtering payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/queryMigrationsRequest'
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/queryMigrationsResponse'
          description: Ok
        401:
          description: Unauthorized
        403:
          description: Forbidden
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Bad Request
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Internal Server Error
      summary: Returns HCX migrations details.
      tags:
      - Query migrations details
components:
  schemas:
    queryMigrationsRequest:
      example:
        '{filter={skipDrafts=true,createTimeEpoch=1583692200000},options={resultLevel="MOBILITYGROUP_ITEMS",compat=2.1}}'
      type: object
      properties:
        filter:
          type: object
          description: This section is to specify filter parameters to query specified filter-matched migrations.
          properties:
            migrationGroupId:
              type: array
              description: Array of migration group identifiers.
              items:
                type: string
            creationDateInterval:
              type: number
              description: Creation Date interval in milliseconds.
            state:
              type: array
              description: Array of migration states.
              items:
                type: string
            id:
              type: array
              description: Array of migration IDs.
              items:
                type: string 
            migrationId:
              type: array
              description: Array of migration IDs.
              items:
                type: string 
            entityId:
              type: array
              description: Array of migrating source virtual machine IDs.
              items:
                type: string
            migrationType:
              type: array
              description: Array of migration types.
              items:
                type: string 
            transferType:
              type: array
              description: Array of transfer types.
              items:
                type: string
            source_endpointId:
              type: array
              description: Array of source endpoint IDs.
              items:
                type: string
            destination_endpointId:
              type: array
              description: Array of destination endpoint IDs.
              items:
                type: string
            destination_resourceId:
              type: array
              description: Array of destination resource IDs.
              items:
                type: string 
            source_resourceId:
              type: array
              description: Array of source resource IDs.
              items:
                type: string
            endpointId:
              type: array
              description: Array of either source or destination endpoint IDs.
              items:
                type: string
            resourceId:
              type: array
              description: Array of either source or destination resource IDs.
              items:
                type: string 
            userName:
              type: array
              description: Array of user names  that initiated the migrations.
              items:
                type: string
            draftsOnly:
              type: boolean
              description: Returns draft state migrations. 
            includeArchived:
              type: boolean
              description: Specifies whether to return the archieved migrations.
            entity_id:
              type: array
              description: Array of migration source virtual machine IDs.
              items:
                type: string 
            skipDrafts:
              type: boolean
              description: Specifies whether to skip the draft migrations.
            createTimeEpoch:
              type: number
              description: Creation time of the migration is greater than given value.
        options:
          type: object
          properties:
            resultLevel:
              type: string
              description: Sets the level of detail at which to retrieve migrations.
            compat:
              type: number
              description: Specify the compatibility version supported by the retrieved migration.
        paging:
          type: object
          properties:
            pageSize:
              type: integer
              description: Page size.
            offset:
              type: integer
              description: Offset value from which the records page to be retrieved.
            skipCount:
              type: integer
              description: Number of records to be skipped.
