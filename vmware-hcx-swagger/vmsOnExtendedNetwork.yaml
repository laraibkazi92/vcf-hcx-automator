openapi: 3.0.0
info:
  description: Network Extension API to list VMs on Extended Network.
  version: '1.0'
  title: Network Extension VMs APIs.
  contact:
    name: VMware
  license:
    name: 'Copyright (c) 2020-2021 VMware, Inc. All rights reserved.'
servers:
  - url: https://{server}/hybridity/api/l2Extensions
    variables:
      server:
        description: server host name
        default: api.example.com

paths:
  /{networkExtensionId}/vms:
    get:
      tags:
      - Vms
      operationId:  getVmsOnExtendedNetwork
      summary: Get VMs on extended Network
      description: Get VMs on extended Network
      parameters:
      - name: networkExtensionId
        in: path
        description: Extended Network ID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/SucessGetResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      tags:
      - Vms
      operationId:  postVmsOnExtendedNetwork
      summary: Toggle VM state between Proximity Routed & Non-Proximity Routed
      description: Toggle VM state between Proximity Routed & Non-Proximity Routed
      parameters:
      - name: networkExtensionId
        in: path
        description: Extended Network ID
        required: true
        schema:
          type: string
      requestBody:
        description: List of VMs with desired network state
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postVmsRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessTaskResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          $ref: '#/components/responses/InternalServerError'


components:
  schemas:
    #External defined models
    vms:
      $ref: './components/schemas/vm.yaml'
    errorResponse:
      $ref: '../../../api-common/swagger/1.0/components/schemas/errorResponse.yaml'
    vmsListResponse:
      $ref: './components/schemas/vmsListResponse.yaml'
    postVmsRequest:
      $ref: './components/schemas/postVmsRequest.yaml'
    taskResponse:
      $ref: './components/schemas/taskResponse.yaml'

  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    ApplicationActionBadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/applianceActionPostResponse'
    ApplicationActionUnprocessibleEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/applianceActionPostResponse'
    ApplicationActionSuccessResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/applianceActionPostResponse'
    SucessGetResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/vmsListResponse'
    SuccessTaskResponse:
      description: Accepted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/taskResponse'
  requestBodies:
    applianceActionBody:
      description: request payload.
      required: false
      content:
        application/json:
          schema:
            type: string

  securitySchemes:
    x-hm-authorization:
      description: Obtained from /hybridity/api/session
      type: apiKey
      name: x-hm-authorization
      in: header

security:
  - x-hm-authorization: []

tags:
- name: Vms
  description: Stretch Network Virtual Machines Apis
